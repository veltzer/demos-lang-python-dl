# Generated to let `uv sync` install this repo's Python dependencies.
# The authoritative dependency list is [dependencies].pip in
# rsconstruct.toml; keep the two in sync when editing.

[project]
name = "demos-lang-python-dl"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "datasets",
    "flax",
    "jax",
    "keras",
    "numpy",
    "torch",
    "torchvision",
    "transformers",
]

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "datasets.*",
    "flax.*",
    "jax.*",
    "keras.*",
    "tensorflow.*",
    "torch.*",
    "torchvision.*",
    "transformers.*",
]
ignore_missing_imports = true
