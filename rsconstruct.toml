# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[analyzer.markdown]

[analyzer.python]

[processor.rumdl]
src_dirs = ["src", "notes"]

[processor.zspell]
src_dirs = ["src", "notes"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "tests"]

[processor.pylint]
src_dirs = ["src", "tests"]

[processor.mypy]
src_dirs = ["src", "tests"]

[processor.requirements]
src_dirs = ["src", "tests"]

[processor.pytest]
src_dirs = ["tests"]

[processor.taplo]
src_dirs = ["."]

# Runtime deps: this is a deep-learning demo/exercise repo whose tests import
# the full stack. Heavy to install but required -- pytest imports torch etc.
[dependencies]
pip = [
    "datasets",
    "flax",
    "jax",
    "keras",
    "numpy",
    "tensorflow",
    "torch",
    "torchvision",
    "transformers",
]
