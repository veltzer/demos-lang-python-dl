# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.markdown]

[analyzer.python]

[processor.luacheck]
src_dirs = ["config"]

[processor.tera]
src_dirs = ["tera.templates"]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]

[processor.rumdl]
src_dirs = ["src", "notes"]
src_files = ["README.md"]

[processor.zspell]
src_dirs = ["src", "notes"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "tests"]

[processor.pylint]
src_dirs = ["src", "tests"]

[processor.mypy]
src_dirs = ["src", "tests"]

[processor.pytest]
src_dirs = ["tests"]

[processor.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# Runtime deps: this is a deep-learning demo/exercise repo whose tests import
# the full stack. Heavy to install but required -- pytest imports torch etc.

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
