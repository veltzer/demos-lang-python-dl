# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src", "notes"]

[processor.zspell]
src_dirs = ["src", "notes"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "tests"]

[processor.pylint]
src_dirs = ["src", "tests"]

[processor.mypy]
src_dirs = ["src", "tests"]

[processor.requirements]
src_dirs = ["src", "tests"]

[processor.pytest]
src_dirs = ["tests"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["src"]
args = ["--severity=error", "--shell=bash"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# Runtime deps: this is a deep-learning demo/exercise repo whose tests import
# the full stack. Heavy to install but required -- pytest imports torch etc.
[dependencies]
pip = [
    "datasets",
    "flax",
    "jax",
    "keras",
    "numpy",
    "tensorflow",
    "torch",
    "torchvision",
    "transformers",
]
