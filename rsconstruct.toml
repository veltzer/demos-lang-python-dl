# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[analyzer.markdown]

[analyzer.python]

[processor.rumdl]
src_dirs = ["src", "notes"]

[processor.zspell]
src_dirs = ["src", "notes"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "tests"]

[processor.pylint]
src_dirs = ["src", "tests"]

[processor.mypy]
src_dirs = ["src", "tests"]

[processor.requirements]
src_dirs = ["src", "tests"]
# tensorflow publishes no cp314 wheel (latest stable 2.21.0 stops at cp313) and
# the CI runner is ubuntu-26.04, which ships Python 3.14 -- so installing it
# there is impossible. The two tf examples guard their import and are skipped
# when it is absent, and the keras examples run on the torch backend (see
# KERAS_BACKEND in tests/conftest.py), so tensorflow is optional here rather
# than a real requirement. Drop this once tensorflow ships cp314 wheels.
exclude = ["tensorflow"]

[processor.pytest]
src_dirs = ["tests"]

[processor.taplo]
src_dirs = ["."]

# Runtime deps: this is a deep-learning demo/exercise repo whose tests import
# the full stack. Heavy to install but required -- pytest imports torch etc.
[dependencies]
# No tensorflow: it publishes no cp314 wheel (latest stable 2.21.0 stops at
# cp313) and the CI runner is ubuntu-26.04, which ships Python 3.14, so
# installing it there is impossible. The two tf examples guard their import
# and their tests skip when it is absent; the keras examples run on the torch
# backend (see KERAS_BACKEND in tests/conftest.py). Restore once tensorflow
# ships cp314 wheels.
pip = [
    "datasets",
    "flax",
    "jax",
    "keras",
    "numpy",
    "torch",
    "torchvision",
    "transformers",
]
